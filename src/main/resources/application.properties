spring.application.name=medical-imaging-backend

# ----------------------------------------------------------------------
# Datasource PostgreSQL
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/medimg
spring.datasource.username=medimg
spring.datasource.password=medimg

# ----------------------------------------------------------------------
# JPA / Hibernate
# Flyway crée le schéma ; Hibernate ne fait que valider.
# ----------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate

# Affichage du SQL en dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------
# Flyway
# ----------------------------------------------------------------------
spring.flyway.enabled=true

# ----------------------------------------------------------------------
# JWT
# ----------------------------------------------------------------------
jwt.secret=${JWT_SECRET:change-me-dev-secret-please-override-in-prod-32chars}
jwt.expiration=86400000

# ----------------------------------------------------------------------
# MinIO
# ----------------------------------------------------------------------
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:medimg}
minio.secret-key=${MINIO_SECRET_KEY:medimg123}
minio.bucket=${MINIO_BUCKET:medimg-images}

# ----------------------------------------------------------------------
# Multipart — fichiers DICOM/imagerie volumineux (défaut Spring = 1MB/10MB,
# insuffisant pour ce use case ; pas une règle métier, un réglage technique).
# Un examen DICOM complet peut compter une centaine de fichiers ou plus
# (ex. série de coupes) : max-request-size relevé en conséquence.
# ----------------------------------------------------------------------
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=4GB

# Le connecteur Tomcat a ses propres limites, indépendantes des réglages
# spring.servlet.multipart.* ci-dessus :
# - max-http-form-post-size / max-swallow-size (taille en octets, défaut 2MB
#   chacun) — sans ça, un gros lot déclenche quand même
#   MaxUploadSizeExceededException.
# - max-part-count (NOMBRE de parts dans le multipart, défaut 50, INDÉPENDANT
#   de la taille en octets) — c'est LA vraie cause du blocage avec un dossier
#   DICOM de 150 fichiers : chaque fichier = une part, 150 > 50 par défaut,
#   peu importe combien on relève les tailles en octets ci-dessus.
server.tomcat.max-http-form-post-size=4GB
server.tomcat.max-swallow-size=4GB
server.tomcat.max-part-count=2000

# ----------------------------------------------------------------------
# CORS — origine(s) autorisée(s) à appeler l'API (liste séparée par des
# virgules). En dev, le frontend Angular tourne sur un port différent
# (ng serve) et appelle l'API en cross-origin.
# ----------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
